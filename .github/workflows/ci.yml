name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source, assets, tests, and production build
        run: npm run ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start isolated production preview
        run: npx astro preview --background --port 4390

      - name: Run responsive site checks
        run: node tests/e2e/site-shell.mjs
        env:
          SORA_BASE_URL: http://localhost:4390

      - name: Test real outputs and recovery for all public tools
        run: npm run test:tools
        env:
          SORA_BASE_URL: http://localhost:4390

      - name: Test OCR disclosure
        run: node tests/e2e/ocr-flows.mjs
        env:
          SORA_BASE_URL: http://localhost:4390

      - name: Stop browser-test servers
        if: always()
        run: npx astro preview stop
